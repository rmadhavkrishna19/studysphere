<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudySphere{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<header class="container py-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
  <a href="{{ url_for('index') }}" class="brand"><i class="sphere" style="--p:62;--s:1.6rem"></i>StudySphere</a>
  <nav class="d-flex gap-1">
    {% for endpoint, label in [('index', 'Home'), ('tasks_page', 'Tasks'), ('progress_page', 'Progress'), ('quiz_page', 'Quiz')] %}
    <a href="{{ url_for(endpoint) }}" class="tab {{ 'on' if request.endpoint == endpoint }}">{{ label }}</a>
    {% endfor %}
  </nav>
</header>
<main class="container pb-5">
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="alert alert-{{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
